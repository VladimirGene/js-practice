<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./style.css" />
		<title>Document</title>
	</head>
	<body>
		
		
		<button data-js-btn>Нажми меня</button>

		<div class="modal" data-js-modal>
			<div class="modal-content" data-js-modal-content>
				<span class="close-btn" data-js-close-modal>&times;</span>
				<form
					class="modal-form"
					id="feedbackForm"
					action="/api/feedback"
					method="POST"
				>
					<label for="phone">Телефон</label>
					<input
						type="tel"
						name="phone"
						id="phone"
						placeholder="+7 (999) 123-45-67"
						required
					/>

					<label for="email">Email</label>
					<input
						type="email"
						name="email"
						id="email"
						placeholder="you@example.com"
						required
					/>

					<label for="message">Сообщение</label>
					<textarea
						name="message"
						id="message"
						rows="4"
						placeholder="Ваше сообщение"
					></textarea>

					<button class="modal-btn styled" type="submit">Отправить</button>
				</form>
			</div>
		</div>
		<button class="modal-btn styled" data-js-modal-btn>Открыть</button>

		<div class="block" data-js-block>
			<h1>Список дел</h1>
		<div class="input-group">
			<input
				class="task-input"
				data-js-input
				type="text"
				placeholder="Новая задача"
			/>
			<button class="add-btn" data-js-btn-todo>Добавить</button>
		</div>
		<ul class="task-list" data-js-list>
			
		</ul>

		</div>

		<script src="./list_task.js" type="module"></script>
	</body>
</html>
