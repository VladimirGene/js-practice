		<div class="calculator js-calculator">
			<form action="" class="calculator__form">
				<div class="calculator__row">
					<input
						class="calculator__display js-calculator__display"
						type="text"
						autofocus
					/>
				</div>
				<div class="calculator__row">
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="C"
					>
						C
					</button>
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="+"
					>
						+
					</button>
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="-"
					>
						-
					</button>
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="*"
					>
						*
					</button>
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="/"
					>
						/
					</button>
					<button
						class="calculator__key js-btn-operation"
						type="button"
						data-value="="
					>
						=
					</button>
				</div>
				<div class="calculator__row">
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="5"
					>
						5
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="6"
					>
						6
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="7"
					>
						7
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="8"
					>
						8
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="9"
					>
						9
					</button>
				</div>
				<div class="calculator__row">
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="0"
					>
						0
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="1"
					>
						1
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="2"
					>
						2
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="3"
					>
						3
					</button>
					<button
						class="calculator__key js-btn-digit"
						type="button"
						data-value="4"
					>
						4
					</button>
				</div>
			</form>
		</div>
